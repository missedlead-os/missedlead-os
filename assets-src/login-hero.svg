<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6C96B"/><stop offset=".45" stop-color="#FBE3A8"/><stop offset="1" stop-color="#FFF4DC"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF8E1" stop-opacity="1"/><stop offset=".35" stop-color="#FFE9A8" stop-opacity=".8"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8DB66A"/><stop offset="1" stop-color="#5F8F4A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD978"/><stop offset="1" stop-color="#F6B94A"/>
    </linearGradient>
    <linearGradient id="van" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4E8EE"/>
    </linearGradient>
    <pattern id="lap" width="20" height="16" patternUnits="userSpaceOnUse">
      <rect width="20" height="16" fill="none"/><rect y="14" width="20" height="2" fill="#7A6A52" opacity=".16"/>
    </pattern>
    <linearGradient id="warm" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFC857" stop-opacity=".28"/><stop offset="1" stop-color="#FFC857" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="1200" fill="url(#sky)"/>
  <circle cx="1290" cy="300" r="330" fill="url(#sun)"/>
  <circle cx="1290" cy="300" r="82" fill="#FFF6D6"/>
  <g fill="#FFFFFF" opacity=".7">
    <rect x="160" y="130" width="300" height="34" rx="17"/><rect x="230" y="104" width="170" height="40" rx="20"/>
    <rect x="860" y="190" width="260" height="30" rx="15"/><rect x="920" y="166" width="140" height="36" rx="18"/>
  </g>

  <!-- distant trees -->
  <g>
    <ellipse cx="1180" cy="640" rx="190" ry="170" fill="#6E9A5B"/>
    <ellipse cx="1380" cy="670" rx="200" ry="150" fill="#5F8F4F"/>
    <ellipse cx="1540" cy="620" rx="150" ry="190" fill="#6E9A5B"/>
    <ellipse cx="70" cy="560" rx="150" ry="210" fill="#5F8F4F"/>
    <ellipse cx="-10" cy="640" rx="140" ry="160" fill="#6E9A5B"/>
  </g>

  <!-- lawn -->
  <rect x="0" y="760" width="1600" height="300" fill="url(#lawn)"/>
  <!-- driveway -->
  <polygon points="1010,800 1600,800 1600,1060 900,1060" fill="#C9C5BD"/>
  <polygon points="1010,800 1600,800 1600,812 1010,812" fill="#B5B0A7"/>
  <!-- street + curb -->
  <rect x="0" y="1040" width="1600" height="24" fill="#D9D3C6"/>
  <rect x="0" y="1064" width="1600" height="136" fill="#6C7280"/>
  <rect x="0" y="1064" width="1600" height="8" fill="#555B69"/>
  <g fill="#F7E7B0" opacity=".9"><rect x="80" y="1130" width="150" height="10" rx="5"/><rect x="420" y="1130" width="150" height="10" rx="5"/><rect x="760" y="1130" width="150" height="10" rx="5"/><rect x="1100" y="1130" width="150" height="10" rx="5"/><rect x="1440" y="1130" width="150" height="10" rx="5"/></g>

  <!-- house shadow on lawn -->
  <polygon points="140,800 960,800 780,900 -80,900" fill="#2E4A2A" opacity=".22"/>

  <!-- walkway -->
  <polygon points="486,846 614,846 740,1042 380,1042" fill="#EADFC9"/>
  <polygon points="486,846 614,846 626,866 474,866" fill="#D8CBB0"/>
  <g stroke="#CDBFA3" stroke-width="3"><line x1="470" y1="920" x2="632" y2="920"/><line x1="440" y1="980" x2="660" y2="980"/></g>

  <!-- house: body -->
  <rect x="140" y="470" width="820" height="320" fill="#DCCDB4"/>
  <rect x="140" y="470" width="820" height="320" fill="url(#lap)"/>
  <!-- front gable face -->
  <polygon points="120,480 550,268 980,480" fill="#E8DCC6"/>
  <polygon points="120,480 550,268 980,480" fill="url(#lap)"/>
  <!-- roof (gable edge) -->
  <polygon points="70,506 550,230 1030,506 1000,506 550,262 100,506" fill="#3B4658"/>
  <polygon points="550,230 1030,506 1000,506 550,262" fill="#2F3948"/>
  <!-- rafter tails + knee braces -->
  <g fill="#7A5B3A"><rect x="112" y="486" width="22" height="10"/><rect x="966" y="486" width="22" height="10"/>
  <polygon points="470,470 550,380 630,470 612,470 550,402 488,470"/></g>
  <!-- attic window -->
  <rect x="505" y="318" width="90" height="76" rx="6" fill="#FFFFFF"/>
  <rect x="514" y="327" width="72" height="58" rx="3" fill="url(#glow)"/>
  <g stroke="#FFFFFF" stroke-width="5"><line x1="550" y1="327" x2="550" y2="385"/><line x1="514" y1="356" x2="586" y2="356"/></g>
  <!-- chimney -->
  <rect x="800" y="290" width="70" height="150" fill="#9A5A45"/>
  <rect x="790" y="280" width="90" height="20" fill="#7C4635"/>
  <g stroke="#7C4635" stroke-width="3" opacity=".6"><line x1="800" y1="330" x2="870" y2="330"/><line x1="800" y1="370" x2="870" y2="370"/><line x1="800" y1="410" x2="870" y2="410"/></g>

  <!-- porch roof -->
  <polygon points="100,626 1000,626 960,560 140,560" fill="#3B4658"/>
  <rect x="100" y="626" width="900" height="14" fill="#FFFFFF"/>
  <rect x="140" y="560" width="820" height="8" fill="#2F3948"/>

  <!-- windows -->
  <g>
    <rect x="212" y="656" width="130" height="104" rx="5" fill="#FFFFFF"/>
    <rect x="222" y="666" width="110" height="84" rx="3" fill="url(#glow)"/>
    <g stroke="#FFFFFF" stroke-width="6"><line x1="277" y1="666" x2="277" y2="750"/><line x1="222" y1="708" x2="332" y2="708"/></g>
    <rect x="758" y="656" width="130" height="104" rx="5" fill="#FFFFFF"/>
    <rect x="768" y="666" width="110" height="84" rx="3" fill="url(#glow)"/>
    <g stroke="#FFFFFF" stroke-width="6"><line x1="823" y1="666" x2="823" y2="750"/><line x1="768" y1="708" x2="878" y2="708"/></g>
    <rect x="204" y="760" width="146" height="12" rx="3" fill="#FFFFFF"/>
    <rect x="750" y="760" width="146" height="12" rx="3" fill="#FFFFFF"/>
  </g>

  <!-- front door (blue) -->
  <rect x="488" y="648" width="124" height="152" rx="4" fill="#FFFFFF"/>
  <rect x="498" y="658" width="104" height="142" rx="3" fill="#1D53D6"/>
  <rect x="510" y="670" width="80" height="44" rx="3" fill="url(#glow)"/>
  <g stroke="#1D53D6" stroke-width="5"><line x1="537" y1="670" x2="537" y2="714"/><line x1="563" y1="670" x2="563" y2="714"/></g>
  <rect x="510" y="730" width="80" height="54" rx="3" fill="#1747B8"/>
  <circle cx="580" cy="750" r="6" fill="#F2C14E"/>
  <!-- porch lamps -->
  <g><rect x="458" y="690" width="14" height="30" rx="4" fill="#FFE18A"/><rect x="456" y="684" width="18" height="8" fill="#2F3948"/>
  <rect x="628" y="690" width="14" height="30" rx="4" fill="#FFE18A"/><rect x="626" y="684" width="18" height="8" fill="#2F3948"/></g>

  <!-- porch deck -->
  <rect x="120" y="790" width="860" height="22" fill="#B98C5B"/>
  <rect x="120" y="808" width="860" height="10" fill="#8F6A42"/>
  <!-- steps -->
  <rect x="470" y="812" width="160" height="16" fill="#E4D8C0"/>
  <rect x="456" y="828" width="188" height="18" fill="#D6C8AC"/>

