  <g>
    <g id="col"><polygon points="170,640 214,640 208,730 176,730" fill="#FFFFFF"/><rect x="164" y="730" width="56" height="62" fill="#A39A8C"/><rect x="164" y="730" width="56" height="8" fill="#BDB4A6"/><g stroke="#8D8477" stroke-width="3"><line x1="164" y1="752" x2="220" y2="752"/><line x1="164" y1="772" x2="220" y2="772"/></g></g>
    <use href="#col" x="190"/>
    <use href="#col" x="580"/>
    <use href="#col" x="750"/>
  </g>
  <!-- porch rail between piers -->
  <g fill="#FFFFFF"><rect x="220" y="744" width="140" height="6"/><rect x="220" y="782" width="140" height="6"/>
  <rect x="750" y="744" width="140" height="6"/><rect x="750" y="782" width="140" height="6"/></g>

  <!-- toolbag on porch -->
  <g>
    <ellipse cx="690" cy="806" rx="52" ry="8" fill="#000" opacity=".18"/>
    <path d="M652 760 Q690 718 728 760" fill="none" stroke="#2F3948" stroke-width="9" stroke-linecap="round"/>
    <rect x="644" y="752" width="92" height="54" rx="12" fill="#2F3948"/>
    <rect x="644" y="752" width="92" height="16" rx="8" fill="#3E4B61"/>
    <rect x="644" y="780" width="92" height="10" fill="#F2C14E"/>
    <rect x="676" y="772" width="28" height="22" rx="4" fill="#1D53D6"/>
    <!-- wrench + screwdriver peeking out -->
    <g transform="rotate(-18 664 752)"><rect x="660" y="716" width="9" height="42" rx="3" fill="#B5BEC9"/><circle cx="664.5" cy="714" r="10" fill="#B5BEC9"/><rect x="661" y="702" width="7" height="12" fill="#FBE9C0"/></g>
    <g transform="rotate(14 716 752)"><rect x="712" y="720" width="9" height="38" rx="3" fill="#F2C14E"/><rect x="714.5" y="704" width="4" height="18" fill="#B5BEC9"/></g>
  </g>

  <!-- shrubs + flowers -->
  <g>
    <ellipse cx="150" cy="800" rx="86" ry="46" fill="#4F7F3F"/><ellipse cx="210" cy="810" rx="70" ry="38" fill="#5F9048"/>
    <ellipse cx="410" cy="826" rx="54" ry="30" fill="#4F7F3F"/><ellipse cx="700" cy="830" rx="54" ry="30" fill="#4F7F3F"/>
    <ellipse cx="940" cy="802" rx="96" ry="48" fill="#4F7F3F"/><ellipse cx="880" cy="814" rx="64" ry="36" fill="#5F9048"/>
    <g fill="#F2C14E"><circle cx="120" cy="790" r="7"/><circle cx="160" cy="780" r="7"/><circle cx="196" cy="800" r="7"/><circle cx="900" cy="796" r="7"/><circle cx="950" cy="786" r="7"/><circle cx="930" cy="812" r="7"/><circle cx="410" cy="816" r="6"/><circle cx="702" cy="822" r="6"/></g>
  </g>

  <!-- mailbox -->
  <g><rect x="332" y="880" width="10" height="110" fill="#5B4632"/><rect x="304" y="860" width="68" height="34" rx="16" fill="#1D53D6"/><rect x="304" y="880" width="68" height="14" fill="#1747B8"/><rect x="368" y="852" width="6" height="22" fill="#F2C14E"/></g>

  <!-- yard tree front-left -->
  <g transform="translate(-70 0)">
    <rect x="76" y="820" width="26" height="170" fill="#6B4A30"/>
    <ellipse cx="90" cy="800" rx="120" ry="130" fill="#4F8040"/>
    <ellipse cx="50" cy="840" rx="90" ry="100" fill="#5F9048"/>
    <ellipse cx="136" cy="760" rx="80" ry="90" fill="#6BA052"/>
  </g>

  <!-- white service van (side view, facing right) -->
  <g>
    <ellipse cx="1290" cy="924" rx="250" ry="20" fill="#2E3A2A" opacity=".28"/>
    <!-- ladder on roof -->
    <g stroke="#9AA3B0" stroke-width="6"><line x1="1090" y1="720" x2="1390" y2="720"/><line x1="1090" y1="738" x2="1390" y2="738"/></g>
    <g stroke="#9AA3B0" stroke-width="4"><line x1="1110" y1="720" x2="1110" y2="738"/><line x1="1150" y1="720" x2="1150" y2="738"/><line x1="1190" y1="720" x2="1190" y2="738"/><line x1="1230" y1="720" x2="1230" y2="738"/><line x1="1270" y1="720" x2="1270" y2="738"/><line x1="1310" y1="720" x2="1310" y2="738"/><line x1="1350" y1="720" x2="1350" y2="738"/></g>
    <rect x="1120" y="738" width="8" height="12" fill="#6C7280"/><rect x="1330" y="738" width="8" height="12" fill="#6C7280"/>
    <!-- body -->
    <path d="M1060 760 Q1060 744 1078 744 L1360 744 Q1384 744 1404 764 L1458 820 Q1478 830 1482 850 L1482 892 Q1482 904 1470 904 L1072 904 Q1060 904 1060 892 Z" fill="url(#van)"/>
    <!-- blue stripe -->
    <path d="M1060 836 L1482 836 L1482 862 L1060 862 Z" fill="#1D53D6"/>
    <!-- amber droplet emblem -->
    <path d="M1180 772 Q1160 800 1160 812 A20 20 0 0 0 1200 812 Q1200 800 1180 772 Z" fill="#F2A81D"/>
    <path d="M1172 806 Q1172 814 1178 818" fill="none" stroke="#FFE7A0" stroke-width="4" stroke-linecap="round"/>
    <!-- windows -->
    <path d="M1372 760 L1426 818 L1372 818 Z" fill="#9FC6E8"/>
    <path d="M1372 760 L1396 760 L1440 810 L1426 818Z" fill="#B8D6F0" opacity=".6"/>
    <!-- doors seams -->
    <g stroke="#B9C0CC" stroke-width="3"><line x1="1250" y1="750" x2="1250" y2="900"/><line x1="1372" y1="750" x2="1372" y2="900"/></g>
    <rect x="1256" y="800" width="22" height="6" rx="3" fill="#8F98A6"/>
    <rect x="1440" y="866" width="40" height="14" rx="4" fill="#6C7280"/>
    <rect x="1472" y="846" width="10" height="14" rx="3" fill="#FFE18A"/>
    <!-- wheels -->
    <g><circle cx="1170" cy="906" r="46" fill="#2A2F3A"/><circle cx="1170" cy="906" r="22" fill="#C9CFD8"/><circle cx="1170" cy="906" r="8" fill="#6C7280"/>
    <circle cx="1394" cy="906" r="46" fill="#2A2F3A"/><circle cx="1394" cy="906" r="22" fill="#C9CFD8"/><circle cx="1394" cy="906" r="8" fill="#6C7280"/></g>
  </g>

  <!-- golden evening light overlay -->
  <rect width="1600" height="1200" fill="url(#warm)"/>
  <rect y="0" width="1600" height="1200" fill="#F2A33A" opacity=".06"/>
</svg>
